<style>
:root{
  --bg:#f5f1ea;--card:#fffdf9;--ink:#1e1b16;--mute:#6f675b;--line:#e3dbcd;
  --accent:#b4552d;--again:#c0392b;--hard:#c98a1b;--good:#2f7d4f;--easy:#2a6496;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16140f;--card:#211e18;--ink:#f1ebe0;--mute:#a59c8c;--line:#38332a;--accent:#e07a4b;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:Inter;font-weight:500;font-size:.8rem;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1.3}
.acct{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:500 .78rem Inter;color:var(--mute);cursor:pointer;white-space:nowrap}
.acct.on{color:var(--good);border-color:var(--good)}
.acct-row{display:flex;gap:8px;margin-top:8px}
.acct-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
.err{color:var(--again);font-size:.88rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.panel ol{padding-left:20px;font-size:.92rem}
.panel a{color:var(--accent)}
nav{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}
nav button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 10px;border-radius:999px;font:500 .85rem Inter;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.counts{display:flex;gap:14px;font-size:.85rem;color:var(--mute);margin-bottom:10px}
.counts b{font-weight:600}
.c-new{color:var(--easy)}.c-lrn{color:var(--again)}.c-rev{color:var(--good)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:260px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.25)}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.tag .kind{color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:500}
.q{font-family:Fraunces,serif;font-size:1.3rem;line-height:1.35;margin:0 0 4px}
.a{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;font-size:1.02rem}
.a strong{color:var(--accent)}
.a ul{margin:6px 0;padding-left:20px}
details{margin-top:14px;font-size:.88rem;color:var(--mute)}
details summary{cursor:pointer;font-weight:500}
details p{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0 0;white-space:pre-line}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.show{grid-template-columns:1fr}
.grades{grid-template-columns:repeat(4,1fr)}
.btn{border:0;border-radius:14px;padding:13px 6px;font:600 .95rem Inter;cursor:pointer;color:#fff;background:var(--ink)}
.btn small{display:block;font-weight:500;font-size:.72rem;opacity:.85}
.btn.show-b{background:var(--accent)}
.g1{background:var(--again)}.g2{background:var(--hard)}.g3{background:var(--good)}.g4{background:var(--easy)}
.done{text-align:center;padding:40px 10px}
.done h2{font-family:Fraunces,serif;margin:0 0 8px}
.muted{color:var(--mute);font-size:.88rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.meter{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden;max-width:180px}
.meter i{display:block;height:100%;background:var(--good)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.panel h3{margin:0 0 8px;font-size:1rem}
.deck{cursor:pointer}
.deck.sel{border-color:var(--accent)}
.deck h3{font-family:Fraunces,serif;font-size:1.15rem}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:.92rem}
input[type=number],select{width:90px;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:500 .88rem Inter;cursor:pointer}
.danger{color:var(--again);border-color:var(--again)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 10px;font:500 .8rem Inter;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sync{font-size:.72rem;color:var(--mute)}
.brw{padding:12px 0;border-bottom:1px solid var(--line)}
.brw .q{font-size:1rem}
.brw .ans{font-size:.9rem;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px}

<body>
<div class="wrap">
  <header>
    <h1 id="ttl">Anki Pro</h1>
    <button class="acct" id="acct">Iniciar sesión</button>
  </header>
  <nav>
    <button data-v="decks" class="on">Mazos</button>
    <button data-v="study">Estudiar</button>
    <button data-v="browse">Tarjetas</button>
    <button data-v="stats">Progreso</button>
  </nav>
  <main id="view"></main>
</div>
<div class="bar" id="bar"></div>
<div class="modal" id="modal"><div class="box"><p id="mtext"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" id="mno">Cancelar</button><button class="ghost danger" id="myes">Confirmar</button></div></div></div>

<script src="mazos/viedma.js"></script>
<script src="mazos/promociones.js"></script>
<script src="mazos/rensa.js"></script>
<script>
/* ===================== MAZOS =====================
   Cada mazo vive en mazos/<nombre>.js y se agrega a window.DECKS. */
const DECKS=window.DECKS||[];
const ALL=[];
DECKS.forEach(d=>{
  d.cards=[];const n={};
  d.build((a,k,q,ans)=>{n[a]=(n[a]||0)+1;const c={id:d.idp+a+"-"+n[a],a,k,q,ans,d:d.id};d.cards.push(c);ALL.push(c);});
  d.nums=Object.keys(d.arts).map(Number).sort((x,y)=>x-y);
});
const deckById=id=>DECKS.find(d=>d.id===id);

/* ===================== ESTADO / SRS (SM-2 tipo Anki) ===================== */
const KEY="cevdm-srs-v1";
const MIN=60e3, DAY=864e5;
let S=merge({});
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)S=merge(JSON.parse(r));}catch(e){}}
function merge(x){
  const o={cards:x.cards||{},opts:Object.assign({newPerDay:20,filter:{},deck:""},x.opts||{}),day:x.day||{date:"",newDone:{}},t:x.t||0};
  if(Array.isArray(o.opts.filter))o.opts.filter={viedma:o.opts.filter};          // formato anterior (un solo mazo)
  if(typeof o.day.newDone==="number")o.day.newDone={viedma:o.day.newDone};
  if(!o.opts.deck||!deckById(o.opts.deck))o.opts.deck=(DECKS[0]||{}).id;
  if(!o.opts.seed)o.opts.seed=Math.floor(Math.random()*2147483646)+1; // semilla del orden aleatorio (se sincroniza)
  return o;
}

/* ---------- Cuenta de GitHub (gist privado) ---------- */
const GK="anki-pro:gh", GIST_DESC="Anki Pro - progreso", GIST_FILE="anki-pro.json";
let gh={token:"",user:"",gist:""};
try{const g=localStorage.getItem(GK);if(g)gh=Object.assign(gh,JSON.parse(g));}catch(e){}
let syncMsg="",ghErr="",ghBusy=false,wtimer=null,writing=false,pending=false;
function ghSave(){try{localStorage.setItem(GK,JSON.stringify(gh));}catch(e){}}
function api(path,method,body){
  const hd={"Authorization":"Bearer "+gh.token,"Accept":"application/vnd.github+json"};
  if(body)hd["Content-Type"]="application/json";
  return fetch("https://api.github.com"+path,{method:method||"GET",headers:hd,body:body?JSON.stringify(body):undefined})
    .then(r=>{if(!r.ok){const e=new Error("http "+r.status);e.status=r.status;throw e;}return r.json();});
}
function failMsg(e){return e&&e.status===401?"GitHub ya no acepta el token. Volvé a conectar la cuenta.":"No se pudo sincronizar. Tu progreso sigue guardado en este dispositivo.";}
function note(){const n=document.getElementById("syncnote");if(n)n.textContent=syncMsg;}
function acctBtn(){const b=document.getElementById("acct");b.textContent=gh.token?"● "+gh.user:"Iniciar sesión";b.classList.toggle("on",!!gh.token);}
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(gh.token&&gh.gist){clearTimeout(wtimer);wtimer=setTimeout(push,1500);}
}
async function push(){
  if(writing){pending=true;return;}
  writing=true;
  try{await api("/gists/"+gh.gist,"PATCH",{files:{[GIST_FILE]:{content:JSON.stringify(S)}}});syncMsg="Guardado en tu cuenta de GitHub.";}
  catch(e){syncMsg=failMsg(e);}
  writing=false;note();
  if(pending){pending=false;push();}
}
async function pull(){
  const g=await api("/gists/"+gh.gist),f=g.files&&g.files[GIST_FILE];
  if(!f||!f.content){push();return;}
  const remote=merge(JSON.parse(f.content));
  if((remote.t||0)>(S.t||0)){S=remote;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}cur=null;shown=false;}
  else if((S.t||0)>(remote.t||0))push();
}
async function connect(token){
  token=(token||"").trim();
  if(!token){ghErr="Pegá el token que creaste en GitHub.";render();return;}
  ghErr="";ghBusy=true;render();
  try{
    gh={token,user:"",gist:""};
    const me=await api("/user");gh.user=me.login;
    let found=null;
    for(let page=1;page<=3&&!found;page++){
      const list=await api("/gists?per_page=100&page="+page);
      found=list.find(g=>g.description===GIST_DESC&&g.files&&g.files[GIST_FILE]);
      if(list.length<100)break;
    }
    if(found){gh.gist=found.id;await pull();}
    else{const g=await api("/gists","POST",{description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(S)}}});gh.gist=g.id;}
    ghSave();syncMsg="Conectado como "+gh.user+". Tu progreso se guarda en tu cuenta.";
  }catch(e){
    gh={token:"",user:"",gist:""};ghSave();
    ghErr=e.status===401?"GitHub no aceptó el token. Revisá que lo hayas copiado completo."
      :e.status===403||e.status===404?"El token no tiene permiso para gists. Creá uno nuevo con el permiso gist marcado."
      :"No se pudo conectar con GitHub. Probá de nuevo en un momento.";
  }
  ghBusy=false;render();
}
function disconnect(){gh={token:"",user:"",gist:""};ghSave();syncMsg="";ghErr="";render();}
async function startupPull(){
  if(!gh.token||!gh.gist)return;
  try{await pull();syncMsg="Conectado como "+gh.user+". Tu progreso se guarda en tu cuenta.";render();}
  catch(e){syncMsg=failMsg(e);note();}
}
function exportJson(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="anki-pro-progreso.json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJson(file){
  const r=new FileReader();
  r.onload=()=>{
    try{const x=JSON.parse(r.result);if(!x.cards)throw 0;S=merge(x);save();cur=null;shown=false;ghErr="";syncMsg="Progreso importado.";}
    catch(e){ghErr="Ese archivo no es una copia de seguridad válida.";}
    render();
  };
  r.readAsText(file);
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function accountPanel(){
  let h='<div class="panel"><h3>Cuenta y copia de seguridad</h3>';
  if(gh.token){
    h+=`<p style="margin:0">Sesión iniciada como <b>${esc(gh.user)}</b>. Tu progreso se guarda en un gist privado de tu cuenta de GitHub, así lo ves igual en el celular y en la compu.</p><div class="btns"><button class="ghost" id="gh-out">Cerrar sesión</button></div>`;
  }else{
    h+=`<p style="margin:0">Iniciá sesión con GitHub para guardar el progreso en tu cuenta y usarlo en cualquier dispositivo.</p><ol>
      <li><a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Anki%20Pro" target="_blank" rel="noopener">Creá un token</a> en GitHub con el permiso <b>gist</b> marcado.</li>
      <li>Copialo y pegalo acá.</li></ol>
      <div class="acct-row"><input id="gh-token" type="password" autocomplete="off" placeholder="ghp_..." aria-label="Token de GitHub"><button class="ghost" id="gh-in"${ghBusy?" disabled":""}>${ghBusy?"Conectando...":"Conectar"}</button></div>
      <p class="sync">El token queda solo en este dispositivo. La app lo usa únicamente para leer y escribir un gist privado con tu progreso.</p>`;
  }
  if(ghErr)h+=`<p class="err">${esc(ghErr)}</p>`;
  h+=`<p class="sync" id="syncnote">${esc(syncMsg)}</p>
    <div class="btns"><button class="ghost" id="exp">Descargar copia</button><button class="ghost" id="impb">Cargar copia</button><input id="imp" type="file" accept="application/json,.json" hidden></div></div>`;
  return h;
}
function bindAccount(){
  const $=id=>document.getElementById(id);
  if($("gh-in"))$("gh-in").onclick=()=>connect($("gh-token").value);
  if($("gh-out"))$("gh-out").onclick=disconnect;
  $("exp").onclick=exportJson;
  $("impb").onclick=()=>$("imp").click();
  $("imp").onchange=e=>{if(e.target.files[0])importJson(e.target.files[0]);};
}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function rollDay(){if(S.day.date!==today()){S.day={date:today(),newDone:{}};}}
function st(id){return S.cards[id];}
// Orden aleatorio estable: cada tarjeta recibe un número a partir de la semilla guardada,
// así el orden es el mismo en todos tus dispositivos y no se repite el del código.
function rank(id){let h=S.opts.seed>>>0;for(let i=0;i<id.length;i++){h=Math.imul(h^id.charCodeAt(i),2654435761);h^=h>>>13;}h=Math.imul(h^(h>>>16),2246822507);return (h^(h>>>13))>>>0;}
function D(){return deckById(S.opts.deck)||DECKS[0];}
function filt(d){return S.opts.filter[d.id]||(S.opts.filter[d.id]=[]);}
function active(d){d=d||D();const f=filt(d);return d.cards.filter(c=>!f.length||f.includes(c.a));}

function queue(d){
  d=d||D();
  rollDay();const now=Date.now();
  const due=[],lrn=[],nw=[];
  for(const c of active(d)){
    const s=st(c.id);
    if(!s) nw.push(c);
    else if(s.due<=now){(s.q==="rev"?due:lrn).push(c);}
  }
  lrn.sort((a,b)=>st(a.id).due-st(b.id).due);
  due.sort((a,b)=>rank(a.id)-rank(b.id));
  nw.sort((a,b)=>rank(a.id)-rank(b.id));
  const room=Math.max(0,S.opts.newPerDay-(S.day.newDone[d.id]||0));
  return {lrn,due,nw:nw.slice(0,room)};
}
function nextLearningSoon(){ // tarjetas en aprendizaje que vencen en los próximos 20 min
  const now=Date.now();let m=Infinity;
  for(const c of active()){const s=st(c.id);if(s&&s.q!=="rev"&&s.due>now)m=Math.min(m,s.due);}
  return m-now<20*MIN?m:null;
}
// Pasos de aprendizaje: 1 min, 10 min → graduar a 1 día (fácil: 4 días)
const STEPS=[1*MIN,10*MIN];
function schedule(id,g,preview){
  const now=Date.now();
  let s=st(id)?Object.assign({},st(id)):{q:"new",step:0,ease:2.5,ivl:0,lapses:0,reps:0};
  if(s.q==="new"||s.q==="lrn"||s.q==="rel"){
    const rel=s.q==="rel";
    if(g===1){s.q=rel?"rel":"lrn";s.step=0;s.due=now+STEPS[0];}
    else if(g===2){s.q=rel?"rel":"lrn";s.due=now+(s.step===0?6*MIN:STEPS[s.step]);}
    else if(g===3){
      if(s.step+1<STEPS.length&&!rel){s.q="lrn";s.step++;s.due=now+STEPS[s.step];}
      else{s.q="rev";s.ivl=rel?Math.max(1,s.ivl):1;s.due=now+s.ivl*DAY;}
    }else{s.q="rev";s.ivl=rel?Math.max(2,s.ivl):4;s.due=now+s.ivl*DAY;}
  }else{ // revisión
    if(g===1){s.lapses++;s.ease=Math.max(1.3,s.ease-.2);s.ivl=Math.max(1,Math.round(s.ivl*.5));s.q="rel";s.step=0;s.due=now+10*MIN;}
    else if(g===2){s.ease=Math.max(1.3,s.ease-.15);s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*1.2));s.due=now+s.ivl*DAY;}
    else if(g===3){s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*s.ease));s.due=now+s.ivl*DAY;}
    else{s.ease+=.15;s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*s.ease*1.3));s.due=now+s.ivl*DAY;}
  }
  s.reps++;
  if(preview)return s.due-now;
  return s;
}
function fmt(ms){if(ms<60*MIN)return Math.round(ms/MIN)+" min";if(ms<DAY)return Math.round(ms/36e5)+" h";const d=ms/DAY;if(d<30)return Math.round(d)+" d";if(d<365)return (d/30).toFixed(1).replace(".0","")+" m";return (d/365).toFixed(1)+" a";}

/* ===================== VISTAS ===================== */
const V=document.getElementById("view"),B=document.getElementById("bar");
let view="decks",cur=null,shown=false,browseArt=0;

function render(){
  acctBtn();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  document.getElementById("ttl").textContent=view==="decks"?"Anki Pro":D().head;
  B.innerHTML="";
  ({decks,study,stats,browse})[view]();
}
function pick(){
  const q=queue();
  return q.lrn[0]||q.due[0]||q.nw[0]||null;
}
function study(){
  const q=queue();
  if(!cur||(st(cur.id)&&st(cur.id).due>Date.now()))cur=pick();
  const counts=`<div class="counts"><span class="c-new">Nuevas <b>${q.nw.length}</b></span><span class="c-lrn">Aprendiendo <b>${q.lrn.length}</b></span><span class="c-rev">Repaso <b>${q.due.length}</b></span></div>`;
  if(!cur){
    const soon=nextLearningSoon();
    V.innerHTML=counts+`<div class="card done"><h2>¡Listo por ahora!</h2><p class="muted">${soon?`Tenés tarjetas en aprendizaje que vuelven en ${fmt(soon-Date.now())}. Esperá un momento y volvé.`:`No quedan tarjetas pendientes hoy. Volvé mañana para el repaso.`}</p>
      <button class="ghost" onclick="extraNew()">Estudiar 10 nuevas más</button></div>`;
    if(soon)setTimeout(()=>{if(view==="study"&&!cur)render();},Math.max(1000,soon-Date.now()+500));
    return;
  }
  V.innerHTML=counts+`<div class="card">
    <p class="q">${cur.q}</p>
    ${shown?`<div class="a">${cur.ans}</div><details><summary>Ver texto del artículo</summary><p><b>Artículo ${cur.a}º:</b> ${D().arts[cur.a]}</p></details>`:""}
  </div>`;
  if(!shown){
    B.innerHTML=`<div class="in show"><button class="btn show-b" id="sh">Mostrar respuesta</button></div>`;
    document.getElementById("sh").onclick=()=>{shown=true;render();};
  }else{
    const L=["Otra vez","Difícil","Bien","Fácil"];
    B.innerHTML=`<div class="in grades">${[1,2,3,4].map(g=>`<button class="btn g${g}" data-g="${g}">${L[g-1]}<small>${fmt(schedule(cur.id,g,true))}</small></button>`).join("")}</div>`;
    B.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  }
}
function grade(g){
  if(!st(cur.id))S.day.newDone[cur.d]=(S.day.newDone[cur.d]||0)+1;
  S.cards[cur.id]=schedule(cur.id,g,false);
  save();cur=null;shown=false;render();
}
window.extraNew=()=>{rollDay();const id=D().id;S.day.newDone[id]=Math.max(0,(S.day.newDone[id]||0)-10);save();render();};

function decks(){
  const now=Date.now();
  V.innerHTML=`<p class="muted" style="margin:0 0 10px">Elegí qué norma estudiar.</p>`+DECKS.map(d=>{
    const q=queue(d);const seen=d.cards.filter(c=>st(c.id)).length;
    return `<div class="panel deck${d.id===S.opts.deck?" sel":""}" data-d="${d.id}">
      <h3 style="margin:0">${d.title}</h3><div class="muted">${d.sub} · ${d.cards.length} tarjetas</div>
      <div class="counts" style="margin:10px 0 8px"><span class="c-new">Nuevas <b>${q.nw.length}</b></span><span class="c-lrn">Aprendiendo <b>${q.lrn.length}</b></span><span class="c-rev">Repaso <b>${q.due.length}</b></span></div>
      <div style="display:flex;align-items:center;gap:10px"><span class="meter" style="max-width:none"><i style="width:${seen/d.cards.length*100}%"></i></span><span class="muted">${seen}/${d.cards.length}</span></div>
    </div>`;}).join("");
  V.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>{S.opts.deck=el.dataset.d;cur=null;shown=false;browseArt=0;save();view="study";render();});
}

function stats(){
  const now=Date.now();let tot=0,seen=0,mature=0,dueT=0;
  const rows=[];
  const d=D();
  for(const a of d.nums){
    const cs=d.cards.filter(c=>c.a===a);let sn=0,m=0;
    cs.forEach(c=>{const s=st(c.id);if(s){sn++;if(s.q==="rev"&&s.ivl>=21)m++;if(s.due<=now+DAY)dueT++;}});
    tot+=cs.length;seen+=sn;mature+=m;
    rows.push(`<div class="row"><span style="width:64px">Art. ${a}</span><span class="muted" style="width:70px">${sn}/${cs.length}</span><span class="meter"><i style="width:${cs.length?sn/cs.length*100:0}%"></i></span></div>`);
  }
  V.innerHTML=`<div class="panel"><h3>Resumen · ${d.title}</h3>
   <div class="row"><span>Tarjetas totales</span><b>${tot}</b></div>
   <div class="row"><span>Vistas al menos una vez</span><b>${seen}</b></div>
   <div class="row"><span>Maduras (intervalo ≥ 21 d)</span><b>${mature}</b></div>
   <div class="row" style="border:0"><span>Vencen en las próximas 24 h</span><b>${dueT}</b></div></div>
   <div class="panel"><h3>Por artículo</h3>${rows.join("")}</div>`+settings(d);
  bindAccount();bindSettings(d);
}

function browse(){
  const d=D();
  const chips=`<div class="chips">${[0,...d.nums].map(a=>`<button class="chip ${browseArt===a?"on":""}" data-a="${a}">${a?"Art. "+a:"Todos"}</button>`).join("")}</div>`;
  const list=d.cards.filter(c=>!browseArt||c.a===browseArt).map(c=>{const s=st(c.id);return `<div class="brw"><div class="tag">Art. ${c.a}<span class="kind">${c.k}</span>${s?`<span class="kind">${s.q==="rev"?"próx. "+fmt(Math.max(0,s.due-Date.now())):"aprendiendo"}</span>`:""}</div><div class="q">${c.q}</div><div class="ans">${c.ans}</div></div>`;}).join("");
  V.innerHTML=`<div class="panel">${chips}${browseArt?`<details open><summary>Texto del artículo ${browseArt}</summary><p><b>Artículo ${browseArt}º:</b> ${d.arts[browseArt]}</p></details>`:""}</div><div class="panel">${list}</div>`;
  V.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{browseArt=+b.dataset.a;render();});
}

function settings(d){
  const f=filt(d);
  return `<div class="panel"><h3>Ajustes</h3>
    <label>Tarjetas nuevas por día (por mazo) <input type="number" id="npd" min="1" max="200" value="${S.opts.newPerDay}"></label>
    <div class="muted" style="margin-top:6px">Estudiar sólo estos artículos de este mazo (ninguno = todos):</div>
    <div class="chips">${d.nums.map(a=>`<button class="chip ${f.includes(a)?"on":""}" data-f="${a}">Art. ${a}</button>`).join("")}</div>
    <div class="btns"><button class="ghost danger" id="rstd">Reiniciar este mazo</button></div>
  </div>`+accountPanel()+`
  <div class="panel"><h3>Cómo funciona</h3><p class="muted" style="margin:0">Cada tarjeta apunta a un núcleo funcional (regla, dato, condición, excepción, facultad, prohibición, definición, distinción o caso práctico). Calificá con honestidad: <b>Otra vez</b> la repite en minutos; <b>Bien</b> y <b>Fácil</b> la espacian cada vez más (algoritmo tipo Anki SM-2). Tu progreso se guarda en este dispositivo y, si iniciás sesión, en tu cuenta de GitHub.</p></div>`;
}
function bindSettings(d){
  const f=filt(d);
  document.getElementById("npd").onchange=e=>{S.opts.newPerDay=Math.max(1,Math.min(200,+e.target.value||20));save();};
  V.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const a=+b.dataset.f;const i=f.indexOf(a);i<0?f.push(a):f.splice(i,1);cur=null;shown=false;save();render();});
  document.getElementById("rstd").onclick=()=>confirmBox(`¿Borrar el progreso de “${d.title}”? No se puede deshacer.`,()=>{d.cards.forEach(c=>delete S.cards[c.id]);if(S.day.newDone)delete S.day.newDone[d.id];cur=null;shown=false;save();render();});
}
function confirmBox(t,ok){const m=document.getElementById("modal");document.getElementById("mtext").textContent=t;m.classList.add("on");document.getElementById("mno").onclick=()=>m.classList.remove("on");document.getElementById("myes").onclick=()=>{m.classList.remove("on");ok();};}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
document.addEventListener("keydown",e=>{
  if(view!=="study"||!cur)return;
  if(!shown&&(e.code==="Space"||e.key==="Enter")){e.preventDefault();shown=true;render();}
  else if(shown&&["1","2","3","4"].includes(e.key))grade(+e.key);
});

/* ===================== ARRANQUE ===================== */
document.getElementById("acct").onclick=()=>{view="stats";render();setTimeout(()=>{const t=document.getElementById("gh-token")||document.getElementById("gh-out");if(t)t.scrollIntoView({behavior:"smooth",block:"center"});},50);};
loadLocal();render();startupPull();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){startupPull();if(view==="study"&&!shown){cur=null;render();}}});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
