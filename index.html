<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anki Pro · Código de Edificación de Viedma</title>
<meta name="theme-color" content="#b4552d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anki Pro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea;--card:#fffdf9;--ink:#1e1b16;--mute:#6f675b;--line:#e3dbcd;
  --accent:#b4552d;--again:#c0392b;--hard:#c98a1b;--good:#2f7d4f;--easy:#2a6496;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16140f;--card:#211e18;--ink:#f1ebe0;--mute:#a59c8c;--line:#38332a;--accent:#e07a4b;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:Inter;font-weight:500;font-size:.8rem;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1.3}
.acct{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:500 .78rem Inter;color:var(--mute);cursor:pointer;white-space:nowrap}
.acct.on{color:var(--good);border-color:var(--good)}
.acct-row{display:flex;gap:8px;margin-top:8px}
.acct-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
.err{color:var(--again);font-size:.88rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.panel ol{padding-left:20px;font-size:.92rem}
.panel a{color:var(--accent)}
nav{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}
nav button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 10px;border-radius:999px;font:500 .85rem Inter;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.counts{display:flex;gap:14px;font-size:.85rem;color:var(--mute);margin-bottom:10px}
.counts b{font-weight:600}
.c-new{color:var(--easy)}.c-lrn{color:var(--again)}.c-rev{color:var(--good)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:260px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.25)}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.tag .kind{color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:500}
.q{font-family:Fraunces,serif;font-size:1.3rem;line-height:1.35;margin:0 0 4px}
.a{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;font-size:1.02rem}
.a strong{color:var(--accent)}
.a ul{margin:6px 0;padding-left:20px}
details{margin-top:14px;font-size:.88rem;color:var(--mute)}
details summary{cursor:pointer;font-weight:500}
details p{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0 0;white-space:pre-line}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.show{grid-template-columns:1fr}
.grades{grid-template-columns:repeat(4,1fr)}
.btn{border:0;border-radius:14px;padding:13px 6px;font:600 .95rem Inter;cursor:pointer;color:#fff;background:var(--ink)}
.btn small{display:block;font-weight:500;font-size:.72rem;opacity:.85}
.btn.show-b{background:var(--accent)}
.g1{background:var(--again)}.g2{background:var(--hard)}.g3{background:var(--good)}.g4{background:var(--easy)}
.done{text-align:center;padding:40px 10px}
.done h2{font-family:Fraunces,serif;margin:0 0 8px}
.muted{color:var(--mute);font-size:.88rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.meter{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden;max-width:180px}
.meter i{display:block;height:100%;background:var(--good)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.panel h3{margin:0 0 8px;font-size:1rem}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:.92rem}
input[type=number],select{width:90px;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:500 .88rem Inter;cursor:pointer}
.danger{color:var(--again);border-color:var(--again)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 10px;font:500 .8rem Inter;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sync{font-size:.72rem;color:var(--mute)}
.brw{padding:12px 0;border-bottom:1px solid var(--line)}
.brw .q{font-size:1rem}
.brw .ans{font-size:.9rem;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Código de Edificación · Viedma 2018</h1>
    <button class="acct" id="acct">Iniciar sesión</button>
  </header>
  <nav>
    <button data-v="study" class="on">Estudiar</button>
    <button data-v="stats">Progreso</button>
    <button data-v="browse">Tarjetas</button>
    <button data-v="opts">Ajustes</button>
  </nav>
  <main id="view"></main>
</div>
<div class="bar" id="bar"></div>
<div class="modal" id="modal"><div class="box"><p id="mtext"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" id="mno">Cancelar</button><button class="ghost danger" id="myes">Confirmar</button></div></div></div>

<script>
/* ===================== TEXTO DE LOS ARTÍCULOS ===================== */
const ART = {
1:"Este Código tiene por objeto regular la realización de obras de edificación, fueran de construcción, modificación (ampliación o alteración), refacción y/o demolición.",
2:"Su ámbito de aplicación se extiende al municipio de Viedma y será puesto en vigencia de acuerdo a lo establecido por la Ley Nº 929 y su Modificatoria Nº 1373, Nº 1440, Nº 1553 y Decreto Reglamentario Nº 492/82 o las que la modifiquen o sustituyan.",
3:"Actuará como Organismo de Aplicación de este Código la Municipalidad de Viedma a través de sus oficinas competentes.\nCorresponderá al Organismo de Aplicación de este Código exigir el cumplimiento de los objetivos y normas sancionando las reglamentaciones que considere necesarias.",
4:"A los fines de aplicación de este Código, entiéndase por:\nAcera: Espacio de la calle entre la línea Municipal y la calzada, destinado al tránsito de peatones.\nAlero: Plano horizontal no accesible destinado exclusivamente para resguardo de vanos y muros.\nBalcón: Elemento accesible y transitable, voladizo o no, generalmente prolongación del entrepiso y limitado por un parapeto o baranda.\nCalle: Banda vial de dominio público delimitada entre líneas municipales.\nConducto: Espacio dispuesto para contener tuberías, conducir o evacuar aire, gases, líquidos o sólidos.\nCalzada: Espacio de calle entre aceras enfrentadas, destinadas al tránsito de vehículos.\nEje divisorio: Delimitación entre parcelas de dominio privado.\nEntrepiso: Estructura resistente horizontal.\nEstructura: Armazón o esqueleto y todo elemento resistente de un edificio.\nLínea Municipal (L.M.): Delimitación entre dominio público municipal y el dominio privado.\nLocal: Cada una de las partes cubiertas cerradas en que se divide un edificio.\nLocal habitable: El destinado para propósitos normales de habitación, morada, trabajo, o permanencia continuada de personas con exclusión de lavaderos, cuartos de baño, despensas, pasajes, vestíbulos, depósitos o similares.\nMarquesinas: Alero que avanza sobre un acceso, generalmente ubicado sobre la vía pública.\nMuro: Cerramiento vertical apto para soportar cargas.\nPiso: Espacio comprendido entre el nivel de un solado y el nivel del techo siguiente sobrepuesto.\nSolado: Revestimiento del suelo natural o de un entrepiso.\nSótano: Piso situado bajo el nivel del suelo.\nTabique: Cerramiento vertical no portante.",
5:"Se considera zonificada la localidad de Viedma conforme a las disposiciones del respectivo Código Urbanístico, a los fines de la aplicación de las normas de este Código.",
6:"Los siguientes Reglamentos técnicos forman parte de este código:\n1 - Reglamento Técnico de Fundaciones (CE de la Ciudad de Buenos Aires).\n2 - Reglamento Técnico de Estructuras (CE de la Ciudad de Buenos Aires).\n3 - Proyecto de Reglamento Argentino para Estructuras de Hormigón (PRAEH).\n4 - Reglamento Técnico de Instalaciones Eléctricas (CE de la Ciudad de Buenos Aires).\n5 - Reglamento de O.S.N. o las normas que especifique el Departamento Provincial de Aguas.\n6 - Reglamento de Gas del Estado.\n7 - Reglamento de Agua y Energía de la Nación.\n8 - Reglamento Técnico de Ascensores y Transportadores (CE de la Ciudad de Buenos Aires).\n9 - Normas mínimas de Habitabilidad (SEDUV).\n10 - Normas mínimas de Habitabilidad Higrotérmica (SEDUV).\n11 - Normas de Edificación establecidas por la Secretaría de Estado y Turismo de la Nación (para la construcción de hoteles, moteles, residenciales y hosterías).",
7:"Las obras que se construyan destinadas a habitación deberán ser de carácter permanente.",
8:"Las obras de carácter transitorio deberán justificar su finalidad y contar con autorización expresa de la Municipalidad de Viedma – quien podrá exigir las condiciones mínimas de habitabilidad y saneamiento que considere necesarias.",
9:"No se permitirán construcciones de carácter precario, así como tampoco las hechas de adobe.",
10:"En todas las edificaciones deberán cumplimentarse según las zonas de que se trate, los factores de edificación y ocupación previstos por el Código Urbanístico correspondiente.",
11:"La línea de edificación no podrá avanzar sobre la línea municipal hasta los 2,70m de altura. A partir de esa altura se permitirán salientes para balcones o locales de hasta 1,00m medidas desde la línea municipal y hasta 0,15m del eje divisorio de la propiedad. En caso de ochava la saliente será paralela a la misma.",
12:"En los balcones se podrán ejecutar cerramientos opacos que no superen los 0,90m de altura, medidos desde el solado de los mismos.",
13:"En los balcones que tengan tres lados libres, se permitirá la colocación de pantallas móviles traslúcidas, cribadas o similares que produzcan cerramiento parcial, siempre que este cerramiento cubra como máximo el 50% del perímetro libre.",
14:"Los aleros o marquesinas en planta baja se mantendrán por encima de los 2,40m medidas desde el nivel de vereda y su borde exterior distará del cordón de la vereda como mínimo 0,80m. Se permitirá toldo/pérgola en retiro de frente de 4.00m, ubicado en espacio de estacionamiento.\nSobre los ejes medianeros, el muro divisorio que quedará dentro de la superficie de retiro no podrá superar los 0.60m de altura a partir de los donde se podrá materializar con rejas.\nEl cerco verde de medianeras, se permite con acuerdo de vecinos por escrito.",
15:"En lotes baldíos en determinadas zonas, la Municipalidad podrá exigir la construcción de cercos y muros divisorios cuando lo considere conveniente.\nLos cercos y muros divisorios serán ejecutados en albañilería de ladrillos comunes, bloques huecos o piedra, o c/hormigón simple o armado y deberán tener una altura mínima de 2,00m. y una altura máxima de 2,50m.",
16:"En toda nueva edificación se deberá dar un adecuado tratamiento arquitectónico a las fachadas y a los muros divisorios que queden a la vista desde la vía pública.",
17:"Es obligatorio el revoque y pintado de las fachadas en la zona urbanizada, salvo que el estilo arquitectónico o la naturaleza del material de las fachadas se oponga a ello (como ser ladrillos a la vista, o piedras lajas). En este caso los materiales empleados deberán proteger al muro de fachada contra los agentes atmosféricos.",
18:"Sobre las vías pavimentadas o enripiadas deberán construirse aceras con las características generales que se determinan reglamentariamente. El Organismo de Aplicación podrá exigir en casos especiales, el tratamiento diferenciado de las aceras en algunos entornos y/o sectores particulares de la ciudad, según proyecto particularizado.",
19:"Es obligatoria la construcción y terminación de las aceras con materiales antideslizantes de un ancho mínimo de 1.00 m, quedando terminantemente prohibido los desniveles en sentido transversal. Es obligatorio construir en las esquinas recesos para discapacitados, de acuerdo a las normas vigentes al respecto.",
20:"Cuando las aceras tengan un ancho superior a los 3,00m y el carácter de la vía o el sector lo aconsejen, la Municipalidad de Viedma podrá exigir que se dejen franjas verdes contiguas al cordón de la vereda de no menos de 1,00m. En estos casos se interrumpirán tanto en las esquinas (hasta 9,00m medidos desde la intersección de los cordones), como cuando correspondan con paradas de ómnibus o accesos o guardacoches."
};

/* ===================== TARJETAS (un núcleo funcional cada una) =====================
   k: tipo de núcleo — Regla · Dato · Condición · Excepción · Facultad · Prohibición · Definición · Caso · Distinción */
const C = [];
const add=(a,k,q,ans)=>C.push({id:`${a}-${C.filter(c=>c.a===a).length+1}`,a,k,q,ans});

// Art. 1
add(1,"Regla","¿Cuál es el objeto del Código de Edificación de Viedma?","Regular la <strong>realización de obras de edificación</strong>.");
add(1,"Dato","¿Qué cuatro tipos de obras de edificación regula el Código?","<ul><li>Construcción</li><li>Modificación</li><li>Refacción</li><li>Demolición</li></ul>(“y/o”: pueden darse juntas o separadas)");
add(1,"Dato","Según el Art. 1, ¿qué dos variantes comprende la “modificación”?","<strong>Ampliación</strong> o <strong>alteración</strong>.");
add(1,"Caso","Un propietario sólo quiere demoler un galpón, sin construir nada. ¿Alcanza el Código a esa obra?","Sí. La <strong>demolición</strong> es una de las obras de edificación que el Código regula (Art. 1).");
// Art. 2
add(2,"Regla","¿Cuál es el ámbito territorial de aplicación del Código?","El <strong>municipio de Viedma</strong>.");
add(2,"Dato","¿Qué ley provincial base establece cómo se pone en vigencia el Código?","La <strong>Ley Nº 929</strong>.");
add(2,"Dato","¿Qué modificatorias de la Ley 929 menciona el Art. 2?","Leyes <strong>Nº 1373, Nº 1440 y Nº 1553</strong>.");
add(2,"Dato","¿Qué decreto reglamentario menciona el Art. 2?","El <strong>Decreto Reglamentario Nº 492/82</strong>.");
add(2,"Regla","Si las normas de vigencia citadas en el Art. 2 fueran reemplazadas, ¿qué pasa con la remisión?","Se aplican <strong>las que las modifiquen o sustituyan</strong> (remisión dinámica).");
// Art. 3
add(3,"Regla","¿Quién es el Organismo de Aplicación del Código?","La <strong>Municipalidad de Viedma</strong>, a través de sus <strong>oficinas competentes</strong>.");
add(3,"Facultad","¿Qué le corresponde exigir al Organismo de Aplicación?","El <strong>cumplimiento de los objetivos y normas</strong> del Código.");
add(3,"Facultad","¿Mediante qué instrumento el Organismo de Aplicación hace cumplir el Código?","<strong>Sancionando las reglamentaciones</strong> que considere necesarias.");
// Art. 4 — Definiciones
const DEF=[
["Acera","Espacio de la calle entre la <strong>Línea Municipal y la calzada</strong>, destinado al <strong>tránsito de peatones</strong>."],
["Alero","Plano horizontal <strong>no accesible</strong> destinado <strong>exclusivamente</strong> para resguardo de vanos y muros."],
["Balcón","Elemento <strong>accesible y transitable</strong>, voladizo o no, generalmente prolongación del entrepiso y limitado por un <strong>parapeto o baranda</strong>."],
["Calle","Banda vial de <strong>dominio público</strong> delimitada <strong>entre líneas municipales</strong>."],
["Conducto","Espacio dispuesto para <strong>contener tuberías</strong>, o <strong>conducir o evacuar</strong> aire, gases, líquidos o sólidos."],
["Calzada","Espacio de calle <strong>entre aceras enfrentadas</strong>, destinado al <strong>tránsito de vehículos</strong>."],
["Eje divisorio","Delimitación <strong>entre parcelas de dominio privado</strong>."],
["Entrepiso","<strong>Estructura resistente horizontal</strong>."],
["Estructura","Armazón o esqueleto y <strong>todo elemento resistente</strong> de un edificio."],
["Línea Municipal (L.M.)","Delimitación entre el <strong>dominio público municipal</strong> y el <strong>dominio privado</strong>."],
["Local","Cada una de las <strong>partes cubiertas cerradas</strong> en que se divide un edificio."],
["Local habitable","El destinado a <strong>habitación, morada, trabajo o permanencia continuada de personas</strong> (con exclusiones)."],
["Marquesina","<strong>Alero</strong> que avanza <strong>sobre un acceso</strong>, generalmente ubicado sobre la vía pública."],
["Muro","Cerramiento vertical <strong>apto para soportar cargas</strong>."],
["Piso","Espacio comprendido entre el nivel de un <strong>solado</strong> y el nivel del <strong>techo siguiente</strong> sobrepuesto."],
["Solado","<strong>Revestimiento</strong> del suelo natural o de un entrepiso."],
["Sótano","<strong>Piso</strong> situado <strong>bajo el nivel del suelo</strong>."],
["Tabique","Cerramiento vertical <strong>no portante</strong>."]
];
DEF.forEach(([t,d])=>add(4,"Definición",`Definí: <em>${t}</em>`,d));
add(4,"Excepción","¿Qué locales quedan <em>excluidos</em> de la definición de “local habitable”?","<ul><li>Lavaderos</li><li>Cuartos de baño</li><li>Despensas</li><li>Pasajes</li><li>Vestíbulos</li><li>Depósitos</li><li>o similares</li></ul>");
add(4,"Caso","Un estudio donde una persona trabaja todo el día, ¿es local habitable?","Sí: el <strong>trabajo</strong> y la <strong>permanencia continuada</strong> de personas encuadran en la definición.");
add(4,"Distinción","Muro vs. tabique: ¿cuál es la diferencia?","Ambos son cerramientos verticales; el <strong>muro soporta cargas</strong>, el <strong>tabique no es portante</strong>.");
add(4,"Distinción","Alero vs. balcón: ¿cuál es la diferencia clave?","El alero es <strong>no accesible</strong> (sólo resguardo de vanos y muros); el balcón es <strong>accesible y transitable</strong>, con parapeto o baranda.");
add(4,"Distinción","Acera vs. calzada: ¿qué separa a cada una y a quién está destinada?","Acera: entre L.M. y calzada, para <strong>peatones</strong>. Calzada: entre aceras enfrentadas, para <strong>vehículos</strong>.");
add(4,"Distinción","Línea Municipal vs. eje divisorio: ¿qué separa cada una?","L.M.: dominio <strong>público municipal</strong> / dominio privado. Eje divisorio: entre <strong>parcelas privadas</strong>.");
add(4,"Distinción","¿Qué relación hay entre marquesina y alero?","La marquesina <strong>es un tipo de alero</strong>: el que avanza sobre un acceso, generalmente sobre la vía pública.");
add(4,"Distinción","¿Qué relación hay entre sótano y piso?","El sótano <strong>es un piso</strong>: el situado bajo el nivel del suelo.");
// Art. 5
add(5,"Regla","¿Conforme a qué norma se considera zonificada Viedma a los fines de este Código?","Conforme a las disposiciones del <strong>Código Urbanístico</strong> respectivo.");
// Art. 6
add(6,"Regla","¿Qué carácter tienen los reglamentos técnicos enumerados en el Art. 6?","<strong>Forman parte</strong> del Código de Edificación.");
add(6,"Dato","¿Cuántos reglamentos técnicos enumera el Art. 6?","<strong>Once (11)</strong>.");
add(6,"Dato","¿Qué cuatro reglamentos se toman del Código de Edificación de la Ciudad de Buenos Aires?","<ul><li>Fundaciones</li><li>Estructuras</li><li>Instalaciones Eléctricas</li><li>Ascensores y Transportadores</li></ul>");
add(6,"Dato","¿Qué reglamento rige las estructuras de hormigón?","El <strong>PRAEH</strong>: Proyecto de Reglamento Argentino para Estructuras de Hormigón.");
add(6,"Dato","¿Qué reglamento rige lo sanitario (agua y cloacas)?","El <strong>Reglamento de O.S.N.</strong> o las normas que especifique el <strong>Departamento Provincial de Aguas</strong>.");
add(6,"Dato","¿Qué reglamentos rigen las instalaciones de gas y de energía?","<strong>Gas del Estado</strong> y <strong>Agua y Energía de la Nación</strong>.");
add(6,"Dato","¿Qué normas del SEDUV integran el Código?","Normas mínimas de <strong>Habitabilidad</strong> y normas mínimas de <strong>Habitabilidad Higrotérmica</strong>.");
add(6,"Dato","¿Qué normas aplican a hoteles, moteles, residenciales y hosterías?","Las Normas de Edificación de la <strong>Secretaría de Estado y Turismo de la Nación</strong>.");
// Art. 7
add(7,"Regla","¿Qué carácter deben tener las obras destinadas a habitación?","<strong>Permanente</strong>.");
// Art. 8
add(8,"Condición","¿Qué dos requisitos deben cumplir las obras de carácter transitorio?","1) <strong>Justificar su finalidad</strong>.<br>2) Contar con <strong>autorización expresa</strong> de la Municipalidad.");
add(8,"Facultad","En una obra transitoria, ¿qué puede exigir la Municipalidad además de autorizarla?","Las <strong>condiciones mínimas de habitabilidad y saneamiento</strong> que considere necesarias.");
add(8,"Caso","Un obrador temporario con autorización tácita (nadie objetó). ¿Cumple el Art. 8?","No. La autorización debe ser <strong>expresa</strong>, y además debe justificarse la finalidad.");
// Art. 9
add(9,"Prohibición","¿Qué dos tipos de construcciones prohíbe el Art. 9?","Las de <strong>carácter precario</strong> y las hechas de <strong>adobe</strong>.");

/* ===================== ESTADO / SRS (SM-2 tipo Anki) ===================== */
const KEY="cevdm-srs-v1";
const MIN=60e3, DAY=864e5;
let S={cards:{},opts:{newPerDay:20,filter:[]},day:{date:"",newDone:0},t:0};
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)S=merge(JSON.parse(r));}catch(e){}}
function merge(x){return {cards:x.cards||{},opts:Object.assign({newPerDay:20,filter:[]},x.opts||{}),day:x.day||{date:"",newDone:0},t:x.t||0};}

/* ---------- Cuenta de GitHub (gist privado) ---------- */
const GK="anki-pro:gh", GIST_DESC="Anki Pro - progreso", GIST_FILE="anki-pro.json";
let gh={token:"",user:"",gist:""};
try{const g=localStorage.getItem(GK);if(g)gh=Object.assign(gh,JSON.parse(g));}catch(e){}
let syncMsg="",ghErr="",ghBusy=false,wtimer=null,writing=false,pending=false;
function ghSave(){try{localStorage.setItem(GK,JSON.stringify(gh));}catch(e){}}
function api(path,method,body){
  const hd={"Authorization":"Bearer "+gh.token,"Accept":"application/vnd.github+json"};
  if(body)hd["Content-Type"]="application/json";
  return fetch("https://api.github.com"+path,{method:method||"GET",headers:hd,body:body?JSON.stringify(body):undefined})
    .then(r=>{if(!r.ok){const e=new Error("http "+r.status);e.status=r.status;throw e;}return r.json();});
}
function failMsg(e){return e&&e.status===401?"GitHub ya no acepta el token. Volvé a conectar la cuenta.":"No se pudo sincronizar. Tu progreso sigue guardado en este dispositivo.";}
function note(){const n=document.getElementById("syncnote");if(n)n.textContent=syncMsg;}
function acctBtn(){const b=document.getElementById("acct");b.textContent=gh.token?"● "+gh.user:"Iniciar sesión";b.classList.toggle("on",!!gh.token);}
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(gh.token&&gh.gist){clearTimeout(wtimer);wtimer=setTimeout(push,1500);}
}
async function push(){
  if(writing){pending=true;return;}
  writing=true;
  try{await api("/gists/"+gh.gist,"PATCH",{files:{[GIST_FILE]:{content:JSON.stringify(S)}}});syncMsg="Guardado en tu cuenta de GitHub.";}
  catch(e){syncMsg=failMsg(e);}
  writing=false;note();
  if(pending){pending=false;push();}
}
async function pull(){
  const g=await api("/gists/"+gh.gist),f=g.files&&g.files[GIST_FILE];
  if(!f||!f.content){push();return;}
  const remote=merge(JSON.parse(f.content));
  if((remote.t||0)>(S.t||0)){S=remote;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}cur=null;shown=false;}
  else if((S.t||0)>(remote.t||0))push();
}
async function connect(token){
  token=(token||"").trim();
  if(!token){ghErr="Pegá el token que creaste en GitHub.";render();return;}
  ghErr="";ghBusy=true;render();
  try{
    gh={token,user:"",gist:""};
    const me=await api("/user");gh.user=me.login;
    let found=null;
    for(let page=1;page<=3&&!found;page++){
      const list=await api("/gists?per_page=100&page="+page);
      found=list.find(g=>g.description===GIST_DESC&&g.files&&g.files[GIST_FILE]);
      if(list.length<100)break;
    }
    if(found){gh.gist=found.id;await pull();}
    else{const g=await api("/gists","POST",{description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(S)}}});gh.gist=g.id;}
    ghSave();syncMsg="Conectado como "+gh.user+". Tu progreso se guarda en tu cuenta.";
  }catch(e){
    gh={token:"",user:"",gist:""};ghSave();
    ghErr=e.status===401?"GitHub no aceptó el token. Revisá que lo hayas copiado completo."
      :e.status===403||e.status===404?"El token no tiene permiso para gists. Creá uno nuevo con el permiso gist marcado."
      :"No se pudo conectar con GitHub. Probá de nuevo en un momento.";
  }
  ghBusy=false;render();
}
function disconnect(){gh={token:"",user:"",gist:""};ghSave();syncMsg="";ghErr="";render();}
async function startupPull(){
  if(!gh.token||!gh.gist)return;
  try{await pull();syncMsg="Conectado como "+gh.user+". Tu progreso se guarda en tu cuenta.";render();}
  catch(e){syncMsg=failMsg(e);note();}
}
function exportJson(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="anki-pro-progreso.json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJson(file){
  const r=new FileReader();
  r.onload=()=>{
    try{const x=JSON.parse(r.result);if(!x.cards)throw 0;S=merge(x);save();cur=null;shown=false;ghErr="";syncMsg="Progreso importado.";}
    catch(e){ghErr="Ese archivo no es una copia de seguridad válida.";}
    render();
  };
  r.readAsText(file);
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function accountPanel(){
  let h='<div class="panel"><h3>Cuenta y copia de seguridad</h3>';
  if(gh.token){
    h+=`<p style="margin:0">Sesión iniciada como <b>${esc(gh.user)}</b>. Tu progreso se guarda en un gist privado de tu cuenta de GitHub, así lo ves igual en el celular y en la compu.</p><div class="btns"><button class="ghost" id="gh-out">Cerrar sesión</button></div>`;
  }else{
    h+=`<p style="margin:0">Iniciá sesión con GitHub para guardar el progreso en tu cuenta y usarlo en cualquier dispositivo.</p><ol>
      <li><a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Anki%20Pro" target="_blank" rel="noopener">Creá un token</a> en GitHub con el permiso <b>gist</b> marcado.</li>
      <li>Copialo y pegalo acá.</li></ol>
      <div class="acct-row"><input id="gh-token" type="password" autocomplete="off" placeholder="ghp_..." aria-label="Token de GitHub"><button class="ghost" id="gh-in"${ghBusy?" disabled":""}>${ghBusy?"Conectando...":"Conectar"}</button></div>
      <p class="sync">El token queda solo en este dispositivo. La app lo usa únicamente para leer y escribir un gist privado con tu progreso.</p>`;
  }
  if(ghErr)h+=`<p class="err">${esc(ghErr)}</p>`;
  h+=`<p class="sync" id="syncnote">${esc(syncMsg)}</p>
    <div class="btns"><button class="ghost" id="exp">Descargar copia</button><button class="ghost" id="impb">Cargar copia</button><input id="imp" type="file" accept="application/json,.json" hidden></div></div>`;
  return h;
}
function bindAccount(){
  const $=id=>document.getElementById(id);
  if($("gh-in"))$("gh-in").onclick=()=>connect($("gh-token").value);
  if($("gh-out"))$("gh-out").onclick=disconnect;
  $("exp").onclick=exportJson;
  $("impb").onclick=()=>$("imp").click();
  $("imp").onchange=e=>{if(e.target.files[0])importJson(e.target.files[0]);};
}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function rollDay(){if(S.day.date!==today()){S.day={date:today(),newDone:0};}}
function st(id){return S.cards[id];}
function active(){const f=S.opts.filter;return C.filter(c=>!f.length||f.includes(c.a));}

function queue(){
  rollDay();const now=Date.now();
  const due=[],lrn=[],nw=[];
  for(const c of active()){
    const s=st(c.id);
    if(!s) nw.push(c);
    else if(s.due<=now){(s.q==="rev"?due:lrn).push(c);}
  }
  lrn.sort((a,b)=>st(a.id).due-st(b.id).due);
  due.sort((a,b)=>st(a.id).due-st(b.id).due);
  const room=Math.max(0,S.opts.newPerDay-S.day.newDone);
  return {lrn,due,nw:nw.slice(0,room)};
}
function nextLearningSoon(){ // tarjetas en aprendizaje que vencen en los próximos 20 min
  const now=Date.now();let m=Infinity;
  for(const c of active()){const s=st(c.id);if(s&&s.q!=="rev"&&s.due>now)m=Math.min(m,s.due);}
  return m-now<20*MIN?m:null;
}
// Pasos de aprendizaje: 1 min, 10 min → graduar a 1 día (fácil: 4 días)
const STEPS=[1*MIN,10*MIN];
function schedule(id,g,preview){
  const now=Date.now();
  let s=st(id)?Object.assign({},st(id)):{q:"new",step:0,ease:2.5,ivl:0,lapses:0,reps:0};
  if(s.q==="new"||s.q==="lrn"||s.q==="rel"){
    const rel=s.q==="rel";
    if(g===1){s.q=rel?"rel":"lrn";s.step=0;s.due=now+STEPS[0];}
    else if(g===2){s.q=rel?"rel":"lrn";s.due=now+(s.step===0?6*MIN:STEPS[s.step]);}
    else if(g===3){
      if(s.step+1<STEPS.length&&!rel){s.q="lrn";s.step++;s.due=now+STEPS[s.step];}
      else{s.q="rev";s.ivl=rel?Math.max(1,s.ivl):1;s.due=now+s.ivl*DAY;}
    }else{s.q="rev";s.ivl=rel?Math.max(2,s.ivl):4;s.due=now+s.ivl*DAY;}
  }else{ // revisión
    if(g===1){s.lapses++;s.ease=Math.max(1.3,s.ease-.2);s.ivl=Math.max(1,Math.round(s.ivl*.5));s.q="rel";s.step=0;s.due=now+10*MIN;}
    else if(g===2){s.ease=Math.max(1.3,s.ease-.15);s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*1.2));s.due=now+s.ivl*DAY;}
    else if(g===3){s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*s.ease));s.due=now+s.ivl*DAY;}
    else{s.ease+=.15;s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*s.ease*1.3));s.due=now+s.ivl*DAY;}
  }
  s.reps++;
  if(preview)return s.due-now;
  return s;
}
function fmt(ms){if(ms<60*MIN)return Math.round(ms/MIN)+" min";if(ms<DAY)return Math.round(ms/36e5)+" h";const d=ms/DAY;if(d<30)return Math.round(d)+" d";if(d<365)return (d/30).toFixed(1).replace(".0","")+" m";return (d/365).toFixed(1)+" a";}

/* ===================== VISTAS ===================== */
const V=document.getElementById("view"),B=document.getElementById("bar");
let view="study",cur=null,shown=false,browseArt=0;

function render(){
  acctBtn();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  B.innerHTML="";
  ({study,stats,browse,opts})[view]();
}
function pick(){
  const q=queue();
  return q.lrn[0]||q.due[0]||q.nw[0]||null;
}
function study(){
  const q=queue();
  if(!cur||(st(cur.id)&&st(cur.id).due>Date.now()))cur=pick();
  const counts=`<div class="counts"><span class="c-new">Nuevas <b>${q.nw.length}</b></span><span class="c-lrn">Aprendiendo <b>${q.lrn.length}</b></span><span class="c-rev">Repaso <b>${q.due.length}</b></span></div>`;
  if(!cur){
    const soon=nextLearningSoon();
    V.innerHTML=counts+`<div class="card done"><h2>¡Listo por ahora!</h2><p class="muted">${soon?`Tenés tarjetas en aprendizaje que vuelven en ${fmt(soon-Date.now())}. Esperá un momento y volvé.`:`No quedan tarjetas pendientes hoy. Volvé mañana para el repaso.`}</p>
      <button class="ghost" onclick="extraNew()">Estudiar 10 nuevas más</button></div>`;
    if(soon)setTimeout(()=>{if(view==="study"&&!cur)render();},Math.max(1000,soon-Date.now()+500));
    return;
  }
  V.innerHTML=counts+`<div class="card">
    <p class="q">${cur.q}</p>
    ${shown?`<div class="a">${cur.ans}</div><details><summary>Ver texto del artículo</summary><p>${ART[cur.a]}</p></details>`:""}
  </div>`;
  if(!shown){
    B.innerHTML=`<div class="in show"><button class="btn show-b" id="sh">Mostrar respuesta</button></div>`;
    document.getElementById("sh").onclick=()=>{shown=true;render();};
  }else{
    const L=["Otra vez","Difícil","Bien","Fácil"];
    B.innerHTML=`<div class="in grades">${[1,2,3,4].map(g=>`<button class="btn g${g}" data-g="${g}">${L[g-1]}<small>${fmt(schedule(cur.id,g,true))}</small></button>`).join("")}</div>`;
    B.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  }
}
function grade(g){
  if(!st(cur.id))S.day.newDone++;
  S.cards[cur.id]=schedule(cur.id,g,false);
  save();cur=null;shown=false;render();
}
window.extraNew=()=>{rollDay();S.day.newDone=Math.max(0,S.day.newDone-10);save();render();};

function stats(){
  const now=Date.now();let tot=0,seen=0,mature=0,dueT=0;
  const rows=[];
  for(let a=1;a<=20;a++){
    const cs=C.filter(c=>c.a===a);let sn=0,m=0;
    cs.forEach(c=>{const s=st(c.id);if(s){sn++;if(s.q==="rev"&&s.ivl>=21)m++;if(s.due<=now+DAY)dueT++;}});
    tot+=cs.length;seen+=sn;mature+=m;
    rows.push(`<div class="row"><span style="width:64px">Art. ${a}</span><span class="muted" style="width:70px">${sn}/${cs.length}</span><span class="meter"><i style="width:${cs.length?sn/cs.length*100:0}%"></i></span></div>`);
  }
  V.innerHTML=accountPanel()+`<div class="panel"><h3>Resumen</h3>
   <div class="row"><span>Tarjetas totales</span><b>${tot}</b></div>
   <div class="row"><span>Vistas al menos una vez</span><b>${seen}</b></div>
   <div class="row"><span>Maduras (intervalo ≥ 21 d)</span><b>${mature}</b></div>
   <div class="row" style="border:0"><span>Vencen en las próximas 24 h</span><b>${dueT}</b></div></div>
   <div class="panel"><h3>Por artículo</h3>${rows.join("")}</div>`;
  bindAccount();
}

function browse(){
  const chips=`<div class="chips">${[0,...Array.from({length:20},(_,i)=>i+1)].map(a=>`<button class="chip ${browseArt===a?"on":""}" data-a="${a}">${a?"Art. "+a:"Todos"}</button>`).join("")}</div>`;
  const list=C.filter(c=>!browseArt||c.a===browseArt).map(c=>{const s=st(c.id);return `<div class="brw"><div class="tag">Art. ${c.a}<span class="kind">${c.k}</span>${s?`<span class="kind">${s.q==="rev"?"próx. "+fmt(Math.max(0,s.due-Date.now())):"aprendiendo"}</span>`:""}</div><div class="q">${c.q}</div><div class="ans">${c.ans}</div></div>`;}).join("");
  V.innerHTML=`<div class="panel">${chips}${browseArt?`<details open><summary>Texto del artículo ${browseArt}</summary><p>${ART[browseArt]}</p></details>`:""}</div><div class="panel">${list}</div>`;
  V.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{browseArt=+b.dataset.a;render();});
}

function opts(){
  const f=S.opts.filter;
  V.innerHTML=`<div class="panel"><h3>Sesión</h3>
    <label>Tarjetas nuevas por día <input type="number" id="npd" min="1" max="200" value="${S.opts.newPerDay}"></label>
    <div class="muted" style="margin-top:6px">Estudiar sólo estos artículos (ninguno = todos):</div>
    <div class="chips">${Array.from({length:20},(_,i)=>i+1).map(a=>`<button class="chip ${f.includes(a)?"on":""}" data-f="${a}">Art. ${a}</button>`).join("")}</div>
  </div>
  <div class="panel"><h3>Cómo funciona</h3><p class="muted" style="margin:0">Cada tarjeta apunta a un núcleo funcional (regla, dato, condición, excepción, facultad, prohibición, definición o caso práctico). Calificá con honestidad: <b>Otra vez</b> la repite en minutos; <b>Bien</b> y <b>Fácil</b> la espacian cada vez más (algoritmo tipo Anki SM-2). Tu progreso se guarda en este dispositivo y, si iniciás sesión en <b>Progreso</b>, en tu cuenta de GitHub.</p></div>
  <div class="panel"><h3>Datos</h3><button class="ghost danger" id="rst">Reiniciar todo el progreso</button></div>`;
  document.getElementById("npd").onchange=e=>{S.opts.newPerDay=Math.max(1,Math.min(200,+e.target.value||20));save();};
  V.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const a=+b.dataset.f;const i=f.indexOf(a);i<0?f.push(a):f.splice(i,1);cur=null;shown=false;save();render();});
  document.getElementById("rst").onclick=()=>confirmBox("¿Borrar todo el progreso? No se puede deshacer.",()=>{S.cards={};S.day={date:today(),newDone:0};cur=null;shown=false;save();render();});
}
function confirmBox(t,ok){const m=document.getElementById("modal");document.getElementById("mtext").textContent=t;m.classList.add("on");document.getElementById("mno").onclick=()=>m.classList.remove("on");document.getElementById("myes").onclick=()=>{m.classList.remove("on");ok();};}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
document.addEventListener("keydown",e=>{
  if(view!=="study"||!cur)return;
  if(!shown&&(e.code==="Space"||e.key==="Enter")){e.preventDefault();shown=true;render();}
  else if(shown&&["1","2","3","4"].includes(e.key))grade(+e.key);
});

/* ===================== ARRANQUE ===================== */
document.getElementById("acct").onclick=()=>{view="stats";render();};
loadLocal();render();startupPull();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){startupPull();if(view==="study"&&!shown){cur=null;render();}}});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
